<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Fill in the Blank Practice</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .blank-input {
            width: 100px;
            margin: 0 5px;
            text-align: center;
        }
        .correct {
            color: green;
            font-weight: bold;
        }
        .incorrect {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<img src="Kanye_West.jpg" alt="Kanye West">
<h1>Fill in the Blank Practice</h1>
<p>중간고사 화이팅!. <br>
    정답을 입력하고, <strong>Check Answers</strong>누르면 정답확인</p>

<button onclick="generateQuestion()">Generate Question</button>
<div id="question-container"></div>

<br>
<button onclick="checkAnswers()">Check Answers</button>
<div id="result"></div>

<script>
    /*
      Replace the MEMORIZED_TEXT below with
      the actual text from the first page’s
      "memorize" section of your PDF.
    */
    const MEMORIZED_TEXT = `
오등은 자에 아 조선의 독립국임과 조선인의 자주민임을 선언하노라. 차로써 세계만방에 고하야 인류평등의 대의를 극명하며, 차로써 자손만대에 고하야 민족자존의 정권을 영유케 하노라. 반만년 역사의 권위를 장하야 차를 선언함이며, 이천만 민중의 성충을 합하야 차를 포명함이며, 민족의 항구여일한 자유발전을 위하야 차를 주장함이며, 인류적 양심의 발로에 기인한 세계개조의 대기운에 순응병진하기 위하야 차를 제기함이니, 시ㅣ 천의 명명이며, 시대의 대세ㅣ며, 전인류 공존동생권의 정당한 발동이라, 천하하물이던지 차를 저지억제치 못할지니라.
희라, 구래의 억울을 선창하려 하면, 시하의 고통을 파탈하려 하면, 장래의 협위를 삼제하려 하면, 민족적 양심과 국가적 염의의 압축소잔을 흥분신장하려 하면, 각개의 인격의 정당한 발달을 수하려 하면, 가련한 자제에게 고치적 재산을 유여치 안이하려 하면, 자자손손의 영구완전한 경복을 도영하려 하면, 최대급무가 민족적 독립을 확실케 함이니, 이천만 각개가 인마다 방촌의 인을 회하고, 인류통성과 시대양심이 정의의 군과 인도의 간과로써 호원하는 금일, 오인은 진하야 취하매 하강을 좌치 못하랴, 퇴하야 작하매 하지를 전치 못하랴.
`;

    // We’ll split the text into sentences or smaller chunks:
    let sentenceList = MEMORIZED_TEXT
        // Split on line breaks or periods — adjust to your text’s structure
        .split(/\n|\.|\r/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

    let currentSentence = "";
    let blanksData = [];  // Will store which words got blanked, so we can check later

    function generateQuestion() {
        // Pick a random sentence from the sentenceList
        const randomIndex = Math.floor(Math.random() * sentenceList.length);
        currentSentence = sentenceList[randomIndex];

        // Split sentence into words
        let words = currentSentence.split(/\s+/);

        // Decide how many blanks to create (1~3, or set a fixed number if you prefer)
        const blanksCount = Math.min(3, Math.floor(Math.random() * 3) + 1);

        // Pick random unique indexes for blanks
        let blankIndexes = [];
        while (blankIndexes.length < blanksCount) {
            let idx = Math.floor(Math.random() * words.length);
            if (!blankIndexes.includes(idx)) {
                blankIndexes.push(idx);
            }
        }

        // Create an array that holds both “original word” and “blank or not”
        blanksData = [];

        let displaySentence = words.map((word, i) => {
            if (blankIndexes.includes(i)) {
                // we blank this word
                blanksData.push({index: i, correctAnswer: word});
                return `<input class="blank-input" type="text" data-index="${i}" />`;
            } else {
                return word;
            }
        }).join(" ");

        // Display the sentence with blanks
        document.getElementById("question-container").innerHTML = displaySentence;

        // Clear previous result
        document.getElementById("result").innerHTML = "";
    }

    function checkAnswers() {
        let inputs = document.querySelectorAll(".blank-input");
        let correctCount = 0;

        // We’ll create a results message
        let resultsMessage = "";

        inputs.forEach(input => {
            let userAnswer = input.value.trim();
            let blankIndex = parseInt(input.getAttribute("data-index"), 10);

            // Find the correct data
            let correctInfo = blanksData.find(b => b.index === blankIndex);
            let correctWord = correctInfo ? correctInfo.correctAnswer : "";

            if (userAnswer === correctWord) {
                correctCount++;
                // optionally style correct answers
                input.style.borderColor = "green";
            } else {
                // optionally style incorrect answers
                input.style.borderColor = "red";
            }
        });

        resultsMessage = `총 ${blanksData.length}개의 빈칸 중 ${correctCount}개를 맞췄습니다.`;
        document.getElementById("result").innerHTML = resultsMessage;
    }
</script>
</body>
</html>
